    state.dailyCheckIn.date = new Date().toDateString(); 
    state.dailyCheckIn.tightAreas = [...appState.checkin.specific];
    state.dailyCheckIn.primaryArea = appState.checkin.primary || null;
    saveState(); 
    
    appState.checkin = { step: 1, broad: [], specific: [], primary: null };
    navigate('recommendation'); 
}
function renderReview(container) {
  const groups = Array.isArray(appState.workout.groups) ? appState.workout.groups : [];
  const listHtml = groups.map((group, groupIndex) => {
    const items = Array.isArray(group.items) ? group.items : [];
    const itemsHtml = items.map((item, itemIndex) => {
      const ex = EXLIB[item.id];
      if (!ex) return "";

      const ukey = item.ukey || `${item.id}_${groupIndex}_${itemIndex}`;
      const tier = Number(ex.tier) || 0;
      const reps = item.reps || ex.reps || "";
      const detail = ex.detail || "";
      const canScaleDown = tier > 1 && tier <= MAX_TIER && !ex.isCustom;
      const canScaleUp = tier >= 1 && tier < MAX_TIER && !ex.isCustom;
      const earned = isEarnedProgression(item.id);
      const tierPill = tier > 0 ? `<span class="tier-pill${earned ? ' progression-pill' : ''}" title="${earned ? 'Earned progression — above your normal profile tier' : `Tier ${tier}`}">${earned ? '↑ T'+tier : 'T'+tier}</span>` : "";
      const customPill = ex.isCustom ? `<span class="tier-pill custom-pill" title="Custom Exercise">★</span>` : "";
      const safeVideo = safeVideoLink(ex.videoUrl, '▶ Watch Video', ' display:inline-block; margin-top:4px;');
      const videoLink = safeVideo ? `<br>${safeVideo}` : '';

      let rowClasses = "exercise";
      if (item.adjusted) rowClasses += " adjusted";
      if (item.scaled === "up") rowClasses += " scaled-up";
      if (item.scaled === "down") rowClasses += " scaled-down";

      const scaleControls = tier > 0 && !ex.isCustom
        ? `
          <div class="scale-btn${canScaleDown ? "" : " disabled"}" onclick="scaleReviewExercise(${groupIndex}, ${itemIndex}, -1)">&lt; Easier</div>
          <div class="swap-btn-main" onclick="swapReviewExercise(${groupIndex}, ${itemIndex})">🔄 Swap</div>
          <div class="scale-btn${canScaleUp ? "" : " disabled"}" onclick="scaleReviewExercise(${groupIndex}, ${itemIndex}, 1)">Harder &gt;</div>
          <div class="scale-btn" onclick="avoidReviewExercise(${groupIndex}, ${itemIndex})" title="Never show this exercise again">🚫 Avoid</div>
        `
        : `
          <div class="swap-btn-main" onclick="swapReviewExercise(${groupIndex}, ${itemIndex})">🔄 Swap</div>
          <div class="scale-btn" onclick="avoidReviewExercise(${groupIndex}, ${itemIndex})" title="Never show this exercise again">🚫 Avoid</div>
        `;

      return `
        <div class="${rowClasses}" id="rev-${escapeHtml(ukey)}" data-gidx="${groupIndex}" data-iidx="${itemIndex}" onclick="toggleReviewExpand('${ukey}')">
          <div class="ex-top">
            <div style="display:flex; align-items:center; gap:8px; min-width:0;">
              <span class="drag-handle" onpointerdown="event.stopPropagation(); startDrag(event, ${groupIndex}, ${itemIndex})" onclick="event.stopPropagation()" title="Drag to reorder">⠿</span>
              <span class="ex-name">${escapeHtml(ex.name)}${tierPill}${customPill}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
              <input type="text" class="rep-input" value="${escapeHtml(reps)}" onchange="updateReviewReps(${groupIndex}, ${itemIndex}, this.value)" onclick="event.stopPropagation()">
              <span onclick="event.stopPropagation(); removeReviewExercise(${groupIndex}, ${itemIndex})" style="cursor:pointer; font-size:1.05rem; color:var(--danger); padding:2px 4px;" title="Remove">🗑️</span>
            </div>
          </div>
          <div class="ex-detail">${escapeHtml(detail)}${videoLink}</div>
          <div class="scale-controls" onclick="event.stopPropagation()">${scaleControls}</div>
        </div>`;
    }).join("");

    const emptyNote = items.length === 0
      ? `<div class="empty-state" style="padding:12px 10px;">No exercises in this section.</div>`
      : "";

    return `<div class="group-label">${escapeHtml(group.heading || "Session")}</div>
      <div class="exercise-list" id="group-items-${groupIndex}">${itemsHtml}</div>
      ${emptyNote}
      <div class="pill" style="width:100%; text-align:center; box-sizing:border-box; margin-bottom:12px; color:var(--accent); font-weight:700;" onclick="openAddExercise(${groupIndex})">+ Add Exercise</div>`;
  }).join("");

  const coachCard = appState.workout.coachNote
    ? `<div class="card" style="border-left:4px solid var(--accent);"><strong>Coach insight</strong><p style="font-size:.85rem;color:var(--muted);margin:6px 0 0;">${escapeHtml(appState.workout.coachNote)}</p></div>`
    : "";
  const warnings = Array.isArray(appState.workout.poolWarnings) ? appState.workout.poolWarnings : [];
  const warningCard = warnings.length
    ? `<div class="card" style="border-left:4px solid #D97706;"><strong>Planning notes</strong><ul style="font-size:.85rem;color:var(--muted);margin:8px 0 0;padding-left:20px;">${warnings.map(warning => `<li>${escapeHtml(warning)}</li>`).join("")}</ul></div>`
    : "";
  const itemCount = groups.reduce((count, group) => count + (Array.isArray(group.items) ? group.items.length : 0), 0);

  container.innerHTML = coachCard + warningCard + `
    <div class="card">
      <div class="card-title">${escapeHtml(appState.workout.label || "Review Session")}</div>
      <p style="text-align:center; font-size:0.85rem; color:var(--muted); margin-top:-10px;">Tap any exercise for instructions, or to Swap, Scale, Remove, or Avoid. Drag ⠿ to reorder.</p>
      ${listHtml}

    ${itemCount > 0
      ? `<button class="btn" onclick="initPlayer(); appState.player.running = true; navigate('player'); startPlayerTimer();">▶ Begin Session</button>`
      : `<div class="empty-state">Add at least one exercise before starting the session.</div>`}
    <div style="display:flex; gap:12px; margin-bottom:12px;">
      <button class="btn btn-secondary" style="margin-bottom:0; flex:1;" onclick="shuffleWorkout()">🔀 Shuffle</button>
      <button class="btn btn-secondary" style="margin-bottom:0; flex:1;" onclick="saveCurrentToLibrary()">⭐ Save</button>

  `;
}

// --- 2b. RECOMMENDATION ---
function appAreaLabel(k) {
    const found = APP_AREAS.broad.concat(APP_AREAS.specific).find(a => a.k === k);
    return found ? found.l : k;
}

function getRecommendation() {
  const today = new Date().toDateString();
  const checkedInToday = !!(state.dailyCheckIn && state.dailyCheckIn.date === today);
  const tightAreas = checkedInToday && Array.isArray(state.dailyCheckIn.tightAreas) ? state.dailyCheckIn.tightAreas : [];
  const primaryFromCheckIn = checkedInToday ? state.dailyCheckIn.primaryArea : null;

  const validTight = tightAreas.filter(k => APP_AREAS.broad.some(a => a.k === k) || APP_AREAS.specific.some(a => a.k === k));
  if (validTight.length > 0) {
      const focus = {};
      validTight.forEach(k => focus[k] = true);
      const labels = validTight.map(appAreaLabel);
      return {
          intention: 'recovery',
          focus,
          primaryArea: (primaryFromCheckIn && validTight.includes(primaryFromCheckIn)) ? primaryFromCheckIn : null,
          icon: '🎯',
          title: 'Recovery — ' + labels.join(' & '),
          subtitle: `You flagged ${labels.join(', ')} today. A short mobility session can help before you load these again.`
      };
  }

  const overall = getOverallRecovery();
  const byArea = {};
  overall.rows.forEach(r => byArea[r.area] = r.status);

  const broadWorkoutAreas = ['upper', 'lower', 'core']; 
  const notReady = broadWorkoutAreas.filter(a => byArea[a] === 'recover');
  const caution = broadWorkoutAreas.filter(a => byArea[a] === 'caution');
  const ready = broadWorkoutAreas.filter(a => byArea[a] === 'ready');

  if (notReady.length >= 2) {
      const focus = {};
      notReady.forEach(a => focus[a] = true);
      return {
          intention: 'recovery',
          focus,
          primaryArea: null,
          icon: '🧘',
          title: 'Recovery Session',
          subtitle: `Recent load is high across ${notReady.map(appAreaLabel).join(' & ')}. A lighter mobility session beats another workout today.`
      };
  }

  if (notReady.length === 1 && ready.length > 0) {
      const focus = {};
      ready.forEach(a => focus[a] = true);
      return {
          intention: 'workout',
          focus,
          primaryArea: null,
          goal: state.profile.trainingGoal || 'general',
          icon: '💪',
          title: ready.map(appAreaLabel).join(' & ') + ' Workout',
          subtitle: `${appAreaLabel(notReady[0])} still needs recovery, so today's session steers around it.`
      };
  }

  return {
      intention: 'workout',
      focus: { fullbody: true },
      primaryArea: null,
      goal: state.profile.trainingGoal || 'general',
      icon: '⚡',
      title: 'Full Body Workout',
      subtitle: caution.length
          ? `Mostly ready — ${caution.map(appAreaLabel).join(', ')} is under mild load, so volume there will stay conservative.`
          : "Everything's looking ready for a normal session."
  };
}

function renderRecommendation(container) {
  const rec = getRecommendation();
  appState._lastRecommendation = rec;
  appState.flowIntention = rec.intention; 

  container.innerHTML = `
    <div class="card" style="text-align:center; padding: 40px 20px;">
        <div style="font-size:3rem; margin-bottom:12px;">${rec.icon}</div>
        <div class="card-title" style="font-size: 1.25rem;">${rec.title}</div>
        <p style="color:var(--muted); font-size:0.9rem; line-height:1.5;">${rec.subtitle}</p>
    </div>
    <button class="btn" onclick="startRecommendedSession()">Start Recommended Session</button>
    <button class="btn btn-secondary" style="border:none;" onclick="navigate('intention')">Customize Instead</button>
  `;
}

function startRecommendedSession() {
  const rec = appState._lastRecommendation || getRecommendation();
  appState.flowIntention = rec.intention;
  appState.flowMethod = 'generate';
  appState.builder.focus = { ...rec.focus };
  appState.builder.primaryArea = rec.primaryArea || null;
  if (rec.intention !== 'recovery') {
      appState.builder.goal = rec.goal || state.profile.trainingGoal || 'general';
      state.profile.trainingGoal = appState.builder.goal;
      saveState();
  }
  continueFromAreas();
}

// --- 5. AREAS (Unified) ---
function toggleArea(k) {
  if (appState.builder.focus[k]) {
      delete appState.builder.focus[k];
  } else {
      if (k === 'fullbody') {
          appState.builder.focus = { fullbody: true };
      } else {
          delete appState.builder.focus.fullbody;
          appState.builder.focus[k] = true;
      }
  }
  if (!appState.builder.focus[appState.builder.primaryArea]) appState.builder.primaryArea = null;
  render();
}

function continueFromAreas() {
  if (appState.flowIntention === 'recovery') {
      appState.builder.stretchAreas = {};
      let hasStretch = false;
      let hasMindful = false;

      Object.keys(appState.builder.focus).forEach(k => {
          if (k === 'mindfulness') {
              hasMindful = true;
          } else if (k !== 'stretching') {
              appState.builder.stretchAreas[k] = true;
              hasStretch = true;
          }
      });

      if (hasStretch) appState.builder.focus.stretching = true;
      else delete appState.builder.focus.stretching;

      if (hasMindful) appState.builder.focus.mindfulness = true;
      else delete appState.builder.focus.mindfulness;

  } else {
      delete appState.builder.focus.stretching;
      delete appState.builder.focus.mindfulness;
  }

  navigate(appState.flowMethod === 'generate' ? 'gen_params' : 'create_list');
}

function getTodaySoreAreas() {
  const today = new Date().toDateString();
  return (state.dailyCheckIn && state.dailyCheckIn.date === today && Array.isArray(state.dailyCheckIn.tightAreas))
      ? [...state.dailyCheckIn.tightAreas]
      : [];
}

function getTodayPrimaryArea() {
  const today = new Date().toDateString();
  return (state.dailyCheckIn && state.dailyCheckIn.date === today && state.dailyCheckIn.primaryArea)
      ? state.dailyCheckIn.primaryArea
      : null;
}

function seedAreasFromCheckIn() {
  if (appState.builder.areasSeeded) return;

  const soreAreas = getTodaySoreAreas();
  if (!soreAreas.length) return;

  soreAreas.forEach(area => {
      if (APP_AREAS.broad.some(a => a.k === area) || APP_AREAS.specific.some(a => a.k === area)) {
          appState.builder.focus[area] = true;
      }
  });

  if (!appState.builder.primaryArea) {
      const primary = getTodayPrimaryArea();
      if (primary && soreAreas.includes(primary)) appState.builder.primaryArea = primary;
  }
  
  appState.builder.areasSeeded = true;
}

function renderAreas(container) {
  seedAreasFromCheckIn();

  const hasSelection = Object.keys(appState.builder.focus).length > 0;
  const activeKeys = Object.keys(appState.builder.focus);

  if (appState.flowIntention === 'recovery') {
      const stretchAreas = [...APP_AREAS.broad, ...APP_AREAS.specific];
      let html = `<div class="group-label" style="text-align:center; border:none; margin-top:0;">Mobility Targets</div><div class="pill-row">`;
      html += stretchAreas.map(a => `<div class="pill${activeKeys.includes(a.k) ? ' active' : ''}" onclick="toggleArea('${a.k}')">${a.l}</div>`).join('');
      html += `</div><div class="group-label" style="text-align:center; border:none; margin-top:24px;">Mindfulness</div><div class="pill-row">`;
      html += `<div class="pill${activeKeys.includes('mindfulness') ? ' active' : ''}" onclick="toggleArea('mindfulness')">🌬️ Mindfulness Session</div></div>`;

      const specificActive = activeKeys.filter(k => APP_AREAS.specific.some(a => a.k === k));
      let primaryHtml = '';
      if (specificActive.length > 1) {
          const primaryOptions = specificActive.map(k => APP_AREAS.specific.find(a => a.k === k));
          primaryHtml = `<div class="group-label" style="text-align:center; border:none; margin-top:24px;">Primary Focus</div>
            <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin:-6px 0 8px;">Which of these is bothering you most?</p>
            <div class="pill-row">
              ${primaryOptions.map(o => `<div class="pill${appState.builder.primaryArea === o.k ? ' active' : ''}" onclick="appState.builder.primaryArea='${o.k}'; render()">${o.l}</div>`).join('')}
            </div>`;
      }

      container.innerHTML = `
        <div class="card">
          <div class="card-title">What needs recovery?</div>
          <p style="text-align:center; font-size:0.85rem; color:var(--muted); margin-top:-6px;">Pick specific areas, Full Body, or just Mindfulness.</p>
          ${html}
          ${primaryHtml}
        </div>
        ${hasSelection ? `<button class="btn" onclick="continueFromAreas()">Continue</button>` : `<div class="empty-state">Select at least one option to continue.</div>`}
      `;
  } else {
      const seeded = appState.builder.areasSeeded && getTodaySoreAreas().length;
      container.innerHTML = `
        <div class="card">
          <div class="card-title">Select Target Areas</div>
          ${seeded ? `<p style="text-align:center;font-size:.8rem;color:var(--accent);margin:-8px 0 12px;">✓ Today's check-in has preselected your sore areas. Change them if you want.</p>` : ''}
          ${buildAreaPills(activeKeys, 'toggleArea')}
        </div>
        ${hasSelection ? `<button class="btn" onclick="continueFromAreas()">Continue</button>` : `<div class="empty-state">Select at least one area to continue.</div>`}
      `;
  }
}

// --- 6. GENERATE PARAMS ---

  const isAutoTime = !isRecovery && appState.builder.minutes === 'auto';

  let autoEstimateHtml = '';
  if (isAutoTime) {
      const est = estimateAutoWorkoutMinutes();

      </div>

// --- 8. REVIEW ---
function recalculateWorkoutTime() {
    if (!appState.workout.label.includes('min')) return;
    let totalSeconds = 0;
    appState.workout.groups.forEach(g => {
        g.items.forEach(item => {
            totalSeconds += (item.secs + TRANSITION);
        });
    });
    let estMins = Math.round(totalSeconds / 60);
    appState.workout.label = appState.workout.label.replace(/· ~\d+ min/, `· ~${estMins} min`);
}

function updateReviewReps(gIdx, iIdx, val) {
    appState.workout.groups[gIdx].items[iIdx].reps = val;
    let secMatch = val.match(/(\d+)\s*sec/i);
    if (secMatch) {
        appState.workout.groups[gIdx].items[iIdx].secs = parseInt(secMatch[1], 10);
        recalculateWorkoutTime();
    }
}

function adjustReviewReps(gIdx, iIdx, direction) {
    const item = appState.workout.groups[gIdx].items[iIdx];
    let currentVal = item.reps;
    
    let isSec = currentVal.includes('sec');
    let step = isSec ? 5 : 1;
    let maxLimit = isSec ? 300 : 100;
    
    let newVal = currentVal.replace(/\d+/g, match => {
        let num = parseInt(match, 10);
        return Math.max(1, Math.min(maxLimit, num + (direction * step)));
    });
    
    item.reps = newVal;
    if (isSec) {
        let secMatch = newVal.match(/\d+/);
        if (secMatch) item.secs = parseInt(secMatch[0], 10);
        recalculateWorkoutTime();
    }
    render();
}

function scaleReviewExercise(gIdx, iIdx, direction) {
   const item = appState.workout.groups[gIdx].items[iIdx];
   const currentEx = EXLIB[item.id];
   if (!currentEx || currentEx.tier === 0 || currentEx.isCustom) return; 
   
   if (item.originalTier === undefined || item.originalTier === null) {
       item.originalTier = currentEx.tier;
   }
   
   const targetTier = currentEx.tier + direction;
   if (targetTier < 1 || targetTier > MAX_TIER) return; 

   let candidates = Object.keys(EXLIB).filter(k => EXLIB[k].family === currentEx.family && EXLIB[k].tier === targetTier && k !== item.id && isExerciseUnlocked(k));
   if (candidates.length === 0) return; 

   const newId = candidates[Math.floor(Math.random() * candidates.length)];
   const adj = getAdjustedExerciseDetails(newId);
   
   appState.workout.groups[gIdx].items[iIdx].id = newId;
   appState.workout.groups[gIdx].items[iIdx].reps = adj.reps; 
   appState.workout.groups[gIdx].items[iIdx].secs = adj.secs; 
   appState.workout.groups[gIdx].items[iIdx].adjusted = adj.isAdjusted;
   
   if (targetTier > item.originalTier) {
       appState.workout.groups[gIdx].items[iIdx].scaled = 'up';
   } else if (targetTier < item.originalTier) {
       appState.workout.groups[gIdx].items[iIdx].scaled = 'down';
   } else {
       appState.workout.groups[gIdx].items[iIdx].scaled = null;
   }
   
   recalculateWorkoutTime();
   render();
}

function swapReviewExercise(gIdx, iIdx) {
  const item = appState.workout.groups[gIdx].items[iIdx];
  const currentEx = EXLIB[item.id];
  let pool = [];
  
  for (let p in POOLS) {
    if (POOLS[p].includes(item.id)) { pool = POOLS[p]; break; }
  }
  if (pool.length === 0) {
      if (item.id.startsWith('m')) pool = Object.keys(EXLIB).filter(k => k.startsWith('m'));
      if (item.id.startsWith('w')) pool = Object.keys(EXLIB).filter(k => k.startsWith('w'));
  }
  
  const sameTierPool = pool.filter(k => EXLIB[k].tier === currentEx.tier && k !== item.id && isExerciseUnlocked(k));
  if (sameTierPool.length === 0) return;

  const newId = sameTierPool[Math.floor(Math.random() * sameTierPool.length)];
  const adj = getAdjustedExerciseDetails(newId);
  
  appState.workout.groups[gIdx].items[iIdx].id = newId;
  appState.workout.groups[gIdx].items[iIdx].reps = adj.reps;
  appState.workout.groups[gIdx].items[iIdx].secs = adj.secs;
  appState.workout.groups[gIdx].items[iIdx].adjusted = adj.isAdjusted;
  recalculateWorkoutTime();
  render();
}

let dragState = null;

function startDrag(evt, gIdx, iIdx) {
   evt.preventDefault();
   const container = document.getElementById('group-items-' + gIdx);
   if (!container) return;
   const rows = Array.from(container.children);
   const row = rows[iIdx];
   if (!row) return;

   dragState = {
      gIdx: gIdx, container: container, row: row, rows: rows,
      startIdx: iIdx, targetIdx: iIdx, startY: evt.clientY,
      rowHeight: row.offsetHeight + 8, pointerId: evt.pointerId
   };

   try { row.setPointerCapture(evt.pointerId); } catch(e) {}
   row.classList.add('dragging');
   row.addEventListener('pointermove', onDragMove);
   row.addEventListener('pointerup', onDragEnd);
   row.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(evt) {
   if (!dragState) return;
   const dy = evt.clientY - dragState.startY;
   dragState.row.style.transform = 'translateY(' + dy + 'px)';

   let newTarget = dragState.startIdx + Math.round(dy / dragState.rowHeight);
   newTarget = Math.max(0, Math.min(dragState.rows.length - 1, newTarget));

   if (newTarget !== dragState.targetIdx) {
      dragState.targetIdx = newTarget;
      dragState.rows.forEach((r, idx) => {
         if (r === dragState.row) return;
         let offset = 0;
         if (dragState.startIdx < newTarget && idx > dragState.startIdx && idx <= newTarget) offset = -1;
         else if (dragState.startIdx > newTarget && idx >= newTarget && idx < dragState.startIdx) offset = 1;
         r.style.transform = offset ? 'translateY(' + (offset * dragState.rowHeight) + 'px)' : '';
      });
   }
}

function onDragEnd(evt) {
   if (!dragState) return;
   const { gIdx, row, rows, startIdx, targetIdx, pointerId } = dragState;

   try { row.releasePointerCapture(pointerId); } catch(e) {}
   row.removeEventListener('pointermove', onDragMove);
   row.removeEventListener('pointerup', onDragEnd);
   row.removeEventListener('pointercancel', onDragEnd);
   row.classList.remove('dragging');
   row.style.transform = '';
   rows.forEach(r => { if (r !== row) r.style.transform = ''; });

   dragState = null;

   if (targetIdx !== startIdx) {
      const items = appState.workout.groups[gIdx].items;
      const [moved] = items.splice(startIdx, 1);
      items.splice(targetIdx, 0, moved);
      render();
   }
}

   if (category !== 'all') ids = ids.filter(id => id.startsWith(category));
   if (term) ids = ids.filter(id => EXLIB[id].name.toLowerCase().includes(term));
   ids.sort((a,b) => EXLIB[a].name.localeCompare(EXLIB[b].name));

   if (ids.length === 0) return `<div class="empty-state">No exercises match. Try a different search or category.</div>`;

   return ids.map(id => {
      const ex = EXLIB[id];
      const tierPill = ex.tier > 0 ? `<span class="tier-pill" title="Tier ${ex.tier}">T${ex.tier}</span>` : ``;
      const customPill = ex.isCustom ? `<span class="tier-pill custom-pill" title="Custom Exercise">★</span>` : ``;
      const safeVideo = safeVideoLink(ex.videoUrl, '▶ Watch Video', ' display:inline-block; margin-top:4px;');
      const videoLink = safeVideo ? `<br>${safeVideo}` : '';
      
      return `
        <div class="exercise" id="add-${id}">
          <div class="ex-top" onclick="addExerciseToGroup('${id}')">
            <div class="ex-left">
              <span class="ex-name">${escapeHtml(ex.name)}${tierPill}${customPill}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span onclick="event.stopPropagation(); toggleAddExpand('${id}')" style="cursor:pointer; font-size:1.05rem; color:var(--muted); padding:2px 4px;" title="Instructions">ⓘ</span>
              <span class="ex-time">${escapeHtml(ex.reps)}</span>
              <span style="color:var(--accent); font-weight:800; font-size:1.2rem; padding:0 2px;">+</span>
            </div>
          </div>
          <div class="ex-detail">${escapeHtml(ex.detail)}${videoLink}</div>
        </div>`;
   }).join("");
}

// --- 9. LIVE PLAYER ---
function buildFlatList() {
  const list = [];
  appState.workout.groups.forEach(g => {
    g.items.forEach(item => {
      if (EXLIB[item.id]) {
          let s = item.secs || EXLIB[item.id].secs;
          list.push({ heading: g.heading, id: item.id, reps: item.reps, secs: s, ukey: item.ukey });
      }
    });
  });
  return list;
}

function getExerciseHalfTime(item) {
    if (!item) return 30;
    const r = (item.reps || "").toLowerCase();
    const isBilateral = r.includes('side') || r.includes('each') || r.includes('leg') || r.includes('arm');
    return isBilateral ? Math.max(1, Math.round(item.secs / 2)) : item.secs;
}

function initPlayer() {
  stopPlayerTimer();
  const list = buildFlatList();
  
  appState.player = {
    list: list, idx: 0, phase: 'get_ready',
    secondsLeft: 5, totalSeconds: 5,
    running: false, timerHandle: null, startedAt: Date.now(),
    elapsedSeconds: 0, completedIds: [], completedIndexes: [], currentStartedAt: Date.now(),
    deadlineAt: null, elapsedStartedAt: null, lastAnnouncedSecond: null
  };
}

function clearPlayerTimerHandle() {
  if (appState.player.timerHandle) {
    clearInterval(appState.player.timerHandle);
    appState.player.timerHandle = null;
  }
}

function isPlayerElapsedPhase() {
  const p = appState.player;
  const item = p.list[p.idx];
  return (p.phase === 'work' || p.phase === 'switch_sides') && item && (item.reps || '').includes('reps');
}

function syncPlayerClock(now = Date.now()) {
  const p = appState.player;
  if (!p.running) return;
  if (isPlayerElapsedPhase()) {
    if (p.elapsedStartedAt) p.elapsedSeconds = Math.max(0, Math.floor((now - p.elapsedStartedAt) / 1000));
  } else if (p.deadlineAt) {
    p.secondsLeft = Math.max(0, Math.ceil((p.deadlineAt - now) / 1000));
  }
}

function stopPlayerTimer() {
  syncPlayerClock();
  clearPlayerTimerHandle();
  appState.player.running = false;
  appState.player.deadlineAt = null;
  appState.player.elapsedStartedAt = null;
}

function startPlayerTimer() {
  clearPlayerTimerHandle();
  getAudioCtx();
  const p = appState.player;
  const now = Date.now();
  p.running = true;
  p.lastAnnouncedSecond = null;
  if (isPlayerElapsedPhase()) {
    p.elapsedStartedAt = now - (p.elapsedSeconds * 1000);
    p.deadlineAt = null;
  } else {
    p.deadlineAt = now + (Math.max(0, p.secondsLeft) * 1000);
    p.elapsedStartedAt = null;
  }
  p.timerHandle = setInterval(playerTick, 250);
  updatePlayerDOM();
}

function playerTick() {
  const p = appState.player;
  if (!p.running) return;
  syncPlayerClock();
  
  if (p.phase === 'get_ready') {
      if (p.secondsLeft <= 0) {
          p.phase = 'work';
          const firstItem = p.list[0];
          const halfSecs = getExerciseHalfTime(firstItem);
          p.secondsLeft = halfSecs;
          p.totalSeconds = halfSecs;
          p.elapsedSeconds = 0;
          playCompletionChime();
          startPlayerTimer();
          render();
      } else {
          if (p.secondsLeft <= 5 && p.lastAnnouncedSecond !== p.secondsLeft) playCountdownTick();
          p.lastAnnouncedSecond = p.secondsLeft;
          updatePlayerDOM();
      }
      return;
  }
  
  const isRepBased = p.list[p.idx] && p.list[p.idx].reps.includes('reps');

  if (p.phase === 'work' && isRepBased) {
      updatePlayerDOM();
  } else if (p.phase === 'switch_sides' && isRepBased) {
      updatePlayerDOM();
  } else {
      if (p.secondsLeft <= 0) {
        playCompletionChime();
        onPhaseTimerComplete();
      } else {
        if (p.secondsLeft <= 5 && p.lastAnnouncedSecond !== p.secondsLeft) playCountdownTick();
        p.lastAnnouncedSecond = p.secondsLeft;
        updatePlayerDOM();
      }
  }
}

function playerAdjustTime(amount) {
    const p = appState.player;
    syncPlayerClock();
    p.secondsLeft = Math.max(1, p.secondsLeft + amount);
    if (p.running) p.deadlineAt = Date.now() + (p.secondsLeft * 1000);
    p.lastAnnouncedSecond = null;
    updatePlayerDOM();
}

function playerAdjustReps(amount) {
    const p = appState.player;
    const item = p.list[p.idx];
    let currentVal = item.reps;
    
    let newVal = currentVal.replace(/\d+/g, match => {
        let num = parseInt(match, 10);
        return Math.max(1, num + amount);
    });
    
    item.reps = newVal;
    render(); 
}

function playerAvoidCurrent() {
   const p = appState.player;
   if(!p.list[p.idx]) return;
   const id = p.list[p.idx].id;
   if (!state.profile.avoidList) state.profile.avoidList = [];
   if (!state.profile.avoidList.includes(id)) {
       state.profile.avoidList.push(id);
       saveState();
   }
   skipCurrentExercise();
}

function playerNextSwap() {
   const p = appState.player;
   const item = p.list[p.idx + 1];
   if (!item) return;
   const currentEx = EXLIB[item.id];
   let pool = [];
   for (let pName in POOLS) { if (POOLS[pName].includes(item.id)) { pool = POOLS[pName]; break; } }
   if (pool.length === 0) {
       if (item.id.startsWith('m')) pool = Object.keys(EXLIB).filter(k => k.startsWith('m'));
       if (item.id.startsWith('w')) pool = Object.keys(EXLIB).filter(k => k.startsWith('w'));
   }
   const sameTierPool = pool.filter(k => EXLIB[k].tier === currentEx.tier && k !== item.id && isExerciseUnlocked(k));
   if (sameTierPool.length === 0) return;
   const newId = sameTierPool[Math.floor(Math.random() * sameTierPool.length)];
   const adj = getAdjustedExerciseDetails(newId);
   item.id = newId; item.reps = adj.reps; item.secs = adj.secs;
   render();
}

function playerNextScale(direction) {
   const p = appState.player;
   const item = p.list[p.idx + 1];
   if (!item) return;
   const currentEx = EXLIB[item.id];
   if (!currentEx || currentEx.tier === 0 || currentEx.isCustom) return;
   const targetTier = currentEx.tier + direction;
   if (targetTier < 1 || targetTier > MAX_TIER) return;
   let candidates = Object.keys(EXLIB).filter(k => EXLIB[k].family === currentEx.family && EXLIB[k].tier === targetTier && k !== item.id && isExerciseUnlocked(k));
   if (candidates.length === 0) return;
   const newId = candidates[Math.floor(Math.random() * candidates.length)];
   const adj = getAdjustedExerciseDetails(newId);
   item.id = newId; item.reps = adj.reps; item.secs = adj.secs;
   render();
}

function playerNextAdjustReps(direction) {
   const p = appState.player;
   const item = p.list[p.idx + 1];
   if (!item) return;
   let currentVal = item.reps;
   let isSec = currentVal.includes('sec');
   let step = isSec ? 5 : 1;
   let maxLimit = isSec ? 300 : 100;
   let newVal = currentVal.replace(/\d+/g, match => {
       let num = parseInt(match, 10);
       return Math.max(1, Math.min(maxLimit, num + (direction * step)));
   });
   item.reps = newVal;
   if (isSec) {
       let secMatch = newVal.match(/\d+/);
       if (secMatch) item.secs = parseInt(secMatch[0], 10);
   }
   render();
}

function togglePlayerPause() {
  const p = appState.player;
  if (p.phase === 'waiting' || p.phase === 'get_ready') return; 
  
  if (p.running) {
    stopPlayerTimer(); 
  } else {
    startPlayerTimer();
  }
  render(); 
}

function targetAfterCurrentPhase() {
  const p = appState.player;
  const currentReps = p.list[p.idx] ? p.list[p.idx].reps.toLowerCase() : "";
  const isBilateral = currentReps.includes('side') || currentReps.includes('each') || currentReps.includes('leg') || currentReps.includes('arm');
  
  if (p.phase === 'work' && isBilateral) return 'switch_sides';
  if (p.phase === 'work' || p.phase === 'switch_sides') return 'rest';
  return 'nextWork';
}

function commitPhaseTransition(target) {
  const p = appState.player;
  if (target === 'rest') {
    p.phase = 'rest';
    p.secondsLeft = TRANSITION;
    p.totalSeconds = TRANSITION;
  } else if (target === 'switch_sides') {
    p.phase = 'switch_sides';
    const currentItem = p.list[p.idx];
    const halfSecs = getExerciseHalfTime(currentItem);
    p.secondsLeft = halfSecs; 
    p.totalSeconds = halfSecs;
    p.elapsedSeconds = 0;
  } else {
    p.idx += 1;
    if (p.idx >= p.list.length) { finishWorkout(); return; }
    p.phase = 'work';
    const nextItem = p.list[p.idx];
    const halfSecs = getExerciseHalfTime(nextItem);
    p.secondsLeft = halfSecs;
    p.totalSeconds = halfSecs;
    p.elapsedSeconds = 0;
  }
  p.waitTarget = null;
  startPlayerTimer();
  render();
}

function enterWaitingState(target) {
  const p = appState.player;
  stopPlayerTimer();
  p.phase = 'waiting';
  p.waitTarget = target;
  render();
}

function continueFromWaiting() {
  const p = appState.player;
  if (p.phase !== 'waiting' || !p.waitTarget) return;
  getAudioCtx(); 
  commitPhaseTransition(p.waitTarget);
}

function onPhaseTimerComplete() {
  const p = appState.player;
  const target = targetAfterCurrentPhase();
  if (p.phase === 'work' || p.phase === 'switch_sides') {
    if (target !== 'switch_sides') recordExerciseCompletion(p.list[p.idx] && p.list[p.idx].id, p.idx);
    if (p.idx >= p.list.length - 1 && target !== 'switch_sides') {
        finishWorkout();
        return;
    }
  }
  
  if (state.profile.waitBetweenExercises && target !== 'switch_sides' && p.phase !== 'rest') enterWaitingState(target);
  else commitPhaseTransition(target);
}

function logAndContinue() {
  stopPlayerTimer();
  const p = appState.player;
  if (p.phase === 'waiting') return continueFromWaiting();
  const target = targetAfterCurrentPhase();
  if (p.phase === 'work' || p.phase === 'switch_sides') {
    if (target !== 'switch_sides') recordExerciseCompletion(p.list[p.idx] && p.list[p.idx].id, p.idx);
  }
  commitPhaseTransition(target);
}

function skipCurrentExercise() {
  stopPlayerTimer();
  commitPhaseTransition('rest');
}

function recordExerciseCompletion(id, index){
  if (!id || !EXLIB[id]) return;
  const p = appState.player;
  if (!Array.isArray(p.completedIds)) p.completedIds = [];
  if (!Array.isArray(p.completedIndexes)) p.completedIndexes = [];
  const safeIndex = Number.isInteger(index) ? index : p.idx;
  if (p.completedIndexes.includes(safeIndex)) return;
  p.completedIndexes.push(safeIndex);
  p.completedIds.push(id);
}

function ensureExerciseStat(id){
  if (!state.exerciseStats[id]) {
    state.exerciseStats[id] = { attempts: 0, completed: 0, easyGood: 0, hard: 0, brutal: 0, consecutiveSuccesses: 0, lastRating: null, lastCompletedAt: null, lastProgressedAt: null, level: EXLIB[id] ? EXLIB[id].tier : 1 };
  }
  return state.exerciseStats[id];
}

function checkTargetedSoreAreas() {
    const soreAreas = [...getTodaySoreAreas(), ...getActiveIssues().map(i => i.area)];
    if (soreAreas.length === 0) return [];
    const targeted = [];
    appState.player.completedIds.forEach(id => {
        soreAreas.forEach(area => {
            if (exerciseMatchesArea(id, area) && !targeted.includes(area)) targeted.push(area);
        });
    });
    return targeted.map(areaLabel); 
}

function finishWorkout(){
  stopPlayerTimer();
  appState.pendingCompletion = true;
  appState.targetedSoreAreas = checkTargetedSoreAreas();
  navigate('complete');
}

function completeWorkoutSession(rating){
  const p = appState.player;
  const started = p.startedAt || Date.now();
  const duration = Math.max(1, Math.round((Date.now() - started) / 1000));
  const completedItems = Array.isArray(p.completedIndexes) && p.completedIndexes.length
    ? p.completedIndexes.map(index => p.list[index]).filter(Boolean)
    : (p.completedIds || []).map(id => p.list.find(item => item.id === id)).filter(Boolean);
  const completedIds = completedItems.map(item => item.id);
  const uniqueIds = [...new Set(completedIds)];
  const areaLoad = getAreaLoadBreakdown(72);
  const session = {
    id: 'session_' + Date.now(),
    date: new Date().toISOString(),
    name: appState.workout.label || 'Workout',
    durationSeconds: duration,
    plannedExercises: p.list ? p.list.length : 0,
    completedExercises: completedItems.length,
    rating: rating,
    focus: Object.keys(appState.builder.focus || {}),
    intention: appState.flowIntention || 'workout',
    exercises: completedItems.map(item => ({
      id: item.id,
      name: EXLIB[item.id] ? EXLIB[item.id].name : item.id,
      family: EXLIB[item.id] ? EXLIB[item.id].family : null,
      reps: item.reps || (EXLIB[item.id] && EXLIB[item.id].reps) || '',
      detail: (EXLIB[item.id] && EXLIB[item.id].detail) || '',
      secs: item.secs || (EXLIB[item.id] && EXLIB[item.id].secs) || 0
    })),
    areaLoadBefore: areaLoad
  };
  state.workoutHistory.unshift(session);
  state.workoutHistory = state.workoutHistory.slice(0, 100);

  uniqueIds.forEach(id => {
    const stat = ensureExerciseStat(id);
    stat.attempts += 1;
    stat.completed += 1;
    stat.lastRating = rating;
    stat.lastCompletedAt = session.date;
    stat.lastDurationSeconds = p.list && p.list.find(x => x.id === id) ? p.list.find(x => x.id === id).secs : null;
    if (rating === 'easy' || rating === 'good') {
      stat.easyGood += 1;
      stat.consecutiveSuccesses += 1;
    } else if (rating === 'hard') {
      stat.hard += 1;
      stat.consecutiveSuccesses = 0;
    } else if (rating === 'brutal') {
      stat.brutal += 1;
      stat.consecutiveSuccesses = 0;
    }
    const decision = getExerciseTrainingDecision(id);
    stat.progressionReady = decision.action === 'progress';
    stat.coachDecision = decision.action;
  });
  saveState();
}

function formatTime(secs) {
  const s = Math.max(0, secs);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

function renderPlayer(container) {
  const p = appState.player;

  if (p.phase === 'get_ready') {
    container.innerHTML = `
      <div class="card" style="padding:40px 20px; text-align:center; min-height:520px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div style="font-size:2.5rem; margin-bottom:8px;">⏳</div>
        <div class="player-ex-name">Get Ready...</div>
        <div class="player-timer" style="font-size:6rem; margin:30px 0;">${p.secondsLeft}</div>
        <div class="player-next" style="border:none;">First up: <span style="color:var(--text);">${p.list[0] ? escapeHtml(EXLIB[p.list[0].id].name) : ''}</span></div>
      </div>
      <div style="text-align:center;">
          <span style="color:var(--danger); font-size:0.95rem; font-weight:700; cursor:pointer; padding:10px;" onclick="navigate('home')">Cancel Session</span>
      </div>
    `;
    return;
  }

  // --- WAITING SCREEN ---
  if (p.phase === 'waiting') {
    let upcomingItem = null;
    let nextLabel = "";
    
    if (p.waitTarget === 'switch_sides') {
        upcomingItem = p.list[p.idx];
        nextLabel = "Switch to Side 2";
    } else if (p.waitTarget === 'rest') {
        upcomingItem = p.list[p.idx + 1];
        nextLabel = upcomingItem ? "Rest, then " + EXLIB[upcomingItem.id].name : "Rest, then finish";
    } else {
        upcomingItem = p.list[p.idx + 1];

function getWorkoutStreaks() {
  const days = new Set((state.workoutHistory || []).map(s => new Date(s.date).toDateString()));
  let current = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  if (!days.has(cursor.toDateString())) cursor.setDate(cursor.getDate() - 1);
  while (days.has(cursor.toDateString())) {
    current++;
    cursor.setDate(cursor.getDate() - 1);
  }
  const sorted = [...days].map(d => new Date(d)).sort((a,b) => a - b);
  let longest = 0, run = 0, prev = null;
  sorted.forEach(d => {
    run = (prev && Math.round((d - prev) / 86400000) === 1) ? run + 1 : 1;
    longest = Math.max(longest, run);
    prev = d;
  });
  return { current, longest };
}

function getActiveDayRate(days) {
  const set = new Set((state.workoutHistory || []).map(s => new Date(s.date).toDateString()));
  const today = new Date(); today.setHours(0,0,0,0);
  let count = 0;
  for (let i = 0; i < days; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    if (set.has(d.toDateString())) count++;
  }
  return { count, days, pct: Math.round((count / days) * 100) };
}

function getIntentionBalance(days) {
  const cutoff = Date.now() - days * 86400000;
  let workout = 0, recovery = 0;
  (state.workoutHistory || []).forEach(s => {
    const t = Date.parse(s.date || '') || 0;
    if (t < cutoff) return;
    if (s.intention === 'recovery') recovery++; else workout++;
  });
  return { workout, recovery, total: workout + recovery };
}

function getFilteredDailyLoad(days, area, type) {
  const today = new Date(); today.setHours(0,0,0,0);
  const map = {};
  const order = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toDateString();
    map[key] = 0;
    order.push(key);
  }
  (state.workoutHistory || []).forEach(s => {
    const key = new Date(s.date).toDateString();
    if (!(key in map)) return;
    if (type !== 'all') {
      const sType = s.intention === 'recovery' ? 'recovery' : 'workout';
      if (sType !== type) return;
    }
    (s.exercises || []).forEach(item => {
      const id = item.id || item;
      if (area !== 'all' && !exerciseAreas(id).includes(area)) return;
      map[key] += exerciseLoad(id);
    });
  });
  return order.map(key => ({ date: key, value: map[key] }));
}

function buildLoadChartSVG(data) {
  const w = 600, h = 160, padBottom = 20, padTop = 8;
  const max = Math.max(1, ...data.map(d => d.value));
  const barW = w / data.length;
  const showLabels = data.length <= 31;
  const bars = data.map((d, i) => {
    const bh = (d.value / max) * (h - padTop - padBottom);
    const x = i * barW;
    const y = h - padBottom - bh;
    const isToday = i === data.length - 1;
    const dLabel = new Date(d.date).toLocaleDateString(undefined, {month:'short', day:'numeric'});
    return `<rect x="${x + 1}" y="${y}" width="${Math.max(1, barW - 2)}" height="${Math.max(0, bh)}" rx="2" style="fill:${isToday ? 'var(--accent)' : '#9AA5B1'}; opacity:${d.value > 0 ? 1 : 0.2};"><title>${dLabel}: ${d.value} load</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:150px; display:block;" preserveAspectRatio="none">
    ${bars}
    <line x1="0" y1="${h - padBottom}" x2="${w}" y2="${h - padBottom}" style="stroke:var(--border); stroke-width:1;"/>
  </svg>`;
}

function buildConsistencyCalendarHtml(weeks) {
  const today = new Date(); today.setHours(0,0,0,0);
  const daysMap = {};
  (state.workoutHistory || []).forEach(s => {
    const key = new Date(s.date).toDateString();
    if (!daysMap[key]) daysMap[key] = { workout: false, recovery: false };
    if (s.intention === 'recovery') daysMap[key].recovery = true; else daysMap[key].workout = true;
  });

  const totalDays = weeks * 7;
  const endDow = today.getDay();
  const gridEnd = new Date(today); gridEnd.setDate(gridEnd.getDate() + (6 - endDow));
  const gridStart = new Date(gridEnd); gridStart.setDate(gridStart.getDate() - (totalDays - 1));

  let cells = [];
  for (let d = new Date(gridStart); d <= gridEnd; d.setDate(d.getDate() + 1)) {
    const key = d.toDateString();
    const isFuture = d > today;
    const info = daysMap[key];
    let cls = 'cal-cell';
    let title = d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    if (isFuture) { cls += ' cal-future'; title = ''; }
    else if (info && info.workout && info.recovery) { cls += ' cal-both'; title += ': Workout + Recovery'; }
    else if (info && info.workout) { cls += ' cal-workout'; title += ': Workout'; }
    else if (info && info.recovery) { cls += ' cal-recovery'; title += ': Recovery'; }
    else { cls += ' cal-empty'; title += ': Rest day'; }
    cells.push(`<div class="${cls}"${title ? ` title="${title}"` : ''}></div>`);
  }
  return `<div class="cal-grid" style="grid-template-columns:repeat(${weeks}, 1fr); aspect-ratio:${weeks}/7;">${cells.join('')}</div>`;
}

  container.innerHTML = `

      <div class="profile-row"><span class="profile-label">Overall readiness</span><strong>${recovery.status === 'ready' ? '🟢 Ready' : recovery.status === 'caution' ? '🟡 Caution' : '🔴 Recovery'}</strong></div>
      ${recovery.rows.map(r => `<div class="profile-row"><span class="profile-label">${areaNames[r.area]}</span><span>${r.icon} ${r.label}</span></div>`).join('')}
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:0;">Readiness combines recent session load, hard-session flags and today's check-in. It is a coaching heuristic, not a medical assessment.</p>
    </div>
    <div class="card">
      <div class="card-title">Lifetime Stats</div>
      <div class="profile-row"><span class="profile-label">Sessions Logged</span><strong>${sessions.length}</strong></div>
      <div class="profile-row"><span class="profile-label">Exercise Completions</span><strong>${totalExCompleted.toLocaleString()}</strong></div>
      <div class="profile-row"><span class="profile-label">Movements Learned</span><strong>${stats.length}</strong></div>
    </div>
    <div class="card">
      <div class="card-title">Most Frequent Exercises</div>
      ${topExHtml || '<p class="empty-state">Complete workouts to see your favorites here.</p>'}
    </div>
    <div class="card">
      <div class="card-title">Coach Recommendations</div>
      ${progressable.length ? progressable.map(x => `<div class="preset-card" style="padding:10px 0;"><div class="preset-left"><span class="preset-icon">⬆️</span><span class="preset-name">${escapeHtml(EXLIB[x.id].name)}</span></div><span style="color:var(--muted);font-size:.8rem;">Progress</span></div>`).join('') : ''}
      ${regressions.length ? regressions.map(x => `<div class="preset-card" style="padding:10px 0;"><div class="preset-left"><span class="preset-icon">↘️</span><span class="preset-name">${escapeHtml(EXLIB[x.id].name)}</span></div><span style="color:var(--muted);font-size:.8rem;">Ease off</span></div>`).join('') : ''}
      ${!progressable.length && !regressions.length ? `<p class="empty-state">No changes recommended yet. Keep training and rating sessions.</p>` : ''}
    </div>
    <div class="card">
      <div class="card-title">Recent Training Load</div>
      ${Object.entries(recentLoad).map(([area,val]) => `<div class="profile-row"><span class="profile-label">${areaNames[area]}</span><span>${Math.round(val)} load</span></div>`).join('')}

    </div>
    <div class="card">
      <div class="card-title">Recent Sessions</div>
      ${sessions.slice(0,5).map(s => `<div class="preset-card" style="padding:10px 0;"><div><strong>${escapeHtml(s.name)}</strong><div style="font-size:.78rem;color:var(--muted);">${new Date(s.date).toLocaleDateString()} · ${formatTime(s.durationSeconds)}</div></div><span>${s.rating === 'easy' ? '😌' : s.rating === 'good' ? '🙂' : s.rating === 'hard' ? '😅' : s.rating === 'brutal' ? '🥵' : '—'}</span></div>`).join('') || `<p class="empty-state">No completed workouts logged yet.</p>`}
    </div>
    <div class="card">
      <div class="card-title">Data Export &amp; Backup</div>
      <p style="font-size:.85rem;color:var(--muted);margin-top:0;">Download your raw workout history as a spreadsheet, or backup your entire profile so you can restore it later or move to another device.</p>
      <button class="btn btn-secondary" onclick="exportHistoryCSV()">📊 Export History (CSV)</button>
      <button class="btn btn-secondary" onclick="exportDataJSON()">💾 Full Backup (JSON)</button>
      <button class="btn btn-secondary" style="margin-bottom:0; border-color:var(--accent); color:var(--accent);" onclick="document.getElementById('import-file-input').click()">📥 Import Backup</button>
      <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;" onchange="handleImportFile(event)">
    </div>`;
}

function toggleWaitBetweenExercises(){
  state.profile.waitBetweenExercises = !state.profile.waitBetweenExercises;
  saveState();
  render();
}

// --- 13. ONGOING ISSUES (NEW) ---
function renderIssues(container) {
   const active = getActiveIssues();
   const resolved = (state.issues || []).filter(i => i.status === 'resolved');

   function issueRow(iss, isResolved) {
      const sideLabel = iss.side && iss.side !== 'bilateral' ? ` · ${iss.side[0].toUpperCase()}${iss.side.slice(1)}` : '';
      const sevLabel = (ISSUE_SEVERITIES.find(s => s.k === iss.severity) || {}).l || iss.severity;
      const sevColor = iss.severity === 'flare' ? 'var(--danger)' : (iss.severity === 'moderate' ? '#D97706' : 'var(--muted)');
      return `<div class="exercise" style="cursor:default; ${isResolved ? 'opacity:0.55;' : ''}">
         <div class="ex-top">
            <div class="ex-left" style="pointer-events:auto;">
               <div>
                  <div class="ex-name">${escapeHtml(areaLabel(iss.area))}${escapeHtml(sideLabel)}</div>
                  <div style="font-size:0.78rem; font-weight:700; color:${sevColor}; margin-top:2px;">${escapeHtml(sevLabel.split(' - ')[0])}</div>
                  ${iss.note ? `<div style="font-size:0.82rem; color:var(--muted); margin-top:4px;">${escapeHtml(iss.note)}</div>` : ''}
               </div>
            </div>
         </div>
         <div style="display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
            ${isResolved
               ? `<span class="scale-btn" onclick="setIssueStatus('${iss.id}','active')">Reopen</span>`
               : `<span class="scale-btn" onclick="setIssueStatus('${iss.id}','resolved')">Mark Resolved</span>`}
            <span class="scale-btn" style="color:var(--danger);" onclick="deleteIssue('${iss.id}')">Delete</span>
         </div>
      </div>`;
   }

   container.innerHTML = `
      <div class="card">
         <div class="card-title" style="text-align:left;">Active</div>
         <p style="font-size:0.85rem; color:var(--muted); margin-top:0;">Sessions automatically reduce volume for these areas — and skip them entirely if marked Flare-up.</p>
         ${active.length ? active.map(i => issueRow(i, false)).join('') : `<p style="font-size:0.85rem; color:var(--muted);">No active issues.</p>`}
      </div>
      <button class="btn" onclick="navigate('log_issue')">+ Log an Issue</button>
      ${resolved.length ? `<div class="card">
         <div class="card-title" style="text-align:left;">Resolved</div>
         ${resolved.map(i => issueRow(i, true)).join('')}
      </div>` : ''}
   `;
}

function renderLogIssue(container) {
   const areaOpts = ISSUE_AREA_OPTIONS.map(k => `<option value="${k}">${areaLabel(k)}</option>`).join('');
   const sevOpts = ISSUE_SEVERITIES.map(s => `<option value="${s.k}">${s.l}</option>`).join('');
   container.innerHTML = `
      <div class="card">
         <div class="card-title" style="text-align:left;">Log an Issue</div>
         <div class="profile-row">
            <span class="profile-label">Area</span>
            <select class="profile-select" id="iss_area">${areaOpts}</select>
         </div>
         <div class="profile-row">
            <span class="profile-label">Side</span>
            <select class="profile-select" id="iss_side">
               <option value="bilateral">Both / N/A</option>
               <option value="left">Left</option>
               <option value="right">Right</option>
            </select>
         </div>
         <div class="profile-row">
            <span class="profile-label">Severity</span>
            <select class="profile-select" id="iss_severity">${sevOpts}</select>
         </div>
         <div style="margin-top:12px;">
            <span class="profile-label" style="display:block; margin-bottom:6px;">Note (optional)</span>
            <textarea id="iss_note" rows="3" placeholder="e.g. twinges on overhead reaching" style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-family:inherit; font-size:0.9rem; box-sizing:border-box;"></textarea>
         </div>
      </div>
      <button class="btn" onclick="submitLogIssue()">Save Issue</button>
   `;
}

function submitLogIssue() {
   const area = document.getElementById('iss_area').value;
   const side = document.getElementById('iss_side').value;
   const severity = document.getElementById('iss_severity').value;
   const note = document.getElementById('iss_note').value;
   addIssue(area, side, severity, note);
   goBack();
}

// --- 14. DATA EXPORT ---
function downloadFile(content, fileName, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function csvCell(value) {
    let text = String(value == null ? '' : value);
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return `"${text.replace(/"/g, '""')}"`;
}

function exportHistoryCSV() {
    if (!state.workoutHistory || state.workoutHistory.length === 0) {
        alert("No workout history to export.");
        return;
    }
    let csv = "Date,Workout Name,Duration (sec),Rating,Focus,Completed Exercises,Exercise Details\n";
    state.workoutHistory.forEach(s => {
        let d = csvCell(new Date(s.date).toLocaleDateString());
        let name = csvCell(s.name || '');
        let dur = s.durationSeconds || 0;
        let rating = csvCell(s.rating || 'unrated');
        let focus = csvCell((s.focus || []).join(', '));
        let exercises = s.exercises || [];
        let details = csvCell(exercises.map(e => `${e.name || e.id || ''}: ${e.reps || e.detail || ''}`).join(' | '));
        csv += `${d},${name},${dur},${rating},${focus},${exercises.length},${details}\n`;
    });
    downloadFile(csv, 'movement-os-history.csv', 'text/csv;charset=utf-8;');
}

function exportDataJSON() {
    const dataStr = JSON.stringify(state, null, 2);
    downloadFile(dataStr, 'movement-os-backup.json', 'application/json;charset=utf-8;');
}

function handleImportFile(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
        alert("That backup is too large to import safely (5 MB maximum).");
        input.value = '';
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        let parsed;
        try {
            parsed = JSON.parse(e.target.result);
        } catch (err) {
            alert("That file doesn't look like a valid Movement OS backup (invalid JSON).");
            return;
        }
        const knownKeys = ['profile', 'workoutHistory', 'savedWorkouts', 'customExercises', 'issues', 'exerciseStats'];
        if (!isPlainObject(parsed) || !knownKeys.some(key => Object.prototype.hasOwnProperty.call(parsed, key))) {
            alert("That file doesn't look like a valid Movement OS backup.");
            return;
        }
        const ok = confirm("Importing this backup will replace ALL current data on this device — history, profile, custom exercises, issues, staples and avoid list. This can't be undone. Continue?");
        if (!ok) return;

        state = normaliseState(parsed);
        saveState();
        injectCustomExercises();
        appState.builder = DEFAULT_BUILDER_STATE();
        appState.history = [];
        navigate('profile');
        alert("Backup imported successfully.");
    };
    reader.onerror = function() {
        alert("Couldn't read that file. Please try again.");
    };
    reader.readAsText(file);
    input.value = '';
}

// --- 15. PROFILE ---
function setProfile(key, val) {
   state.profile[key] = val;
   saveState();
   render();
}

function setProfileInput(key, val) {
   state.profile[key] = val;
   saveState();
}

function toggleUnlock(key) {
   if (!state.profile.unlocks) state.profile.unlocks = {};
   state.profile.unlocks[key] = !state.profile.unlocks[key];
   saveState();
   render();
}

function toggleSound() {
   state.profile.soundEnabled = !state.profile.soundEnabled;
   saveState();
   render();
}

function removeCustomExercise(id) {
   if(confirm("Delete this custom exercise? It will be removed from future sessions.")) {
       delete state.customExercises[id];
       delete EXLIB[id];
       saveState();
       render();
   }
}

function renderProfile(container) {
   const levels = [{val: 1, label: "Beginner"}, {val: 2, label: "Intermediate"}, {val: 3, label: "Advanced"}];
   function buildSelect(key, title) {
      let opts = levels.map(l => `<option value="${l.val}" ${state.profile[key]===l.val?"selected":""}>${l.label}</option>`).join("");
      return `<div class="profile-row"><span class="profile-label">${title}</span><select class="profile-select" onchange="setProfile('${key}', parseInt(this.value))">${opts}</select></div>`;
   }

   const bridgesOn = !!(state.profile.unlocks && state.profile.unlocks.advancedBridges);
   const soundOn = state.profile.soundEnabled !== false;
   const waitOn = !!state.profile.waitBetweenExercises;
   
   let avoidHtml = state.profile.avoidList && state.profile.avoidList.length > 0
       ? state.profile.avoidList.map(id => {
           const ex = EXLIB[id];
           return `<div class="profile-row" style="padding: 6px 0;">
                       <span style="font-size:0.9rem;">${escapeHtml(ex ? ex.name : id)}</span>
                       <span onclick="unavoidExercise('${id}')" style="color:var(--danger); cursor:pointer; font-size:0.85rem; font-weight:bold;">Remove</span>
                   </div>`;
       }).join('')
       : `<p style="font-size:0.85rem; color:var(--muted); margin-bottom:0;">No exercises avoided. You can hide specific exercises directly from the 'Review Workout' screen using the 🚫 Avoid button.</p>`;

   let customHtml = state.customExercises && Object.keys(state.customExercises).length > 0
       ? Object.keys(state.customExercises).map(id => {
           const ex = EXLIB[id];
           return `<div class="profile-row" style="padding: 6px 0;">
                       <span style="font-size:0.9rem;">${escapeHtml(ex ? ex.name : id)}</span>
                       <span onclick="removeCustomExercise('${id}')" style="color:var(--danger); cursor:pointer; font-size:0.85rem; font-weight:bold;">Delete</span>
                   </div>`;
       }).join('')
       : `<p style="font-size:0.85rem; color:var(--muted); margin-bottom:0;">No custom exercises created yet. Create them from the "+ Add Exercise" screen.</p>`;

   let stapleHtml = state.profile.alwaysInclude && state.profile.alwaysInclude.length > 0
       ? state.profile.alwaysInclude.map(id => {
           const ex = EXLIB[id];
           return `<div class="profile-row" style="padding: 6px 0;">
                       <span style="font-size:0.9rem;">${escapeHtml(ex ? ex.name : id)}</span>
                       <span onclick="toggleStapleExercise('${id}')" style="color:var(--danger); cursor:pointer; font-size:0.85rem; font-weight:bold;">Remove</span>
                   </div>`;
       }).join('')
       : `<p style="font-size:0.85rem; color:var(--muted); margin-bottom:0;">No staple exercises. Mark an exercise as a Staple from the 'Review Workout' screen to guarantee it appears in your generated sessions.</p>`;

   container.innerHTML = `
      <div class="card">
         <div class="card-title" style="text-align:left;">Biometrics</div>
         <div class="profile-row">
            <span class="profile-label">Height</span>
            <div style="display:flex; gap:6px;">
              <input type="number" class="profile-input" value="${escapeHtml(state.profile.height || '')}" placeholder="e.g. 175" style="width:80px; text-align:right;" onchange="setProfileInput('height', this.value)">
              <select class="profile-select" onchange="setProfileInput('heightUnit', this.value)">
                <option value="cm" ${state.profile.heightUnit==='cm'?'selected':''}>cm</option>
                <option value="in" ${state.profile.heightUnit==='in'?'selected':''}>in</option>
              </select>
            </div>
         </div>
         <div class="profile-row">
            <span class="profile-label">Weight</span>
            <div style="display:flex; gap:6px;">
              <input type="number" class="profile-input" value="${escapeHtml(state.profile.weight || '')}" placeholder="e.g. 75" style="width:80px; text-align:right;" onchange="setProfileInput('weight', this.value)">
              <select class="profile-select" onchange="setProfileInput('weightUnit', this.value)">
                <option value="kg" ${state.profile.weightUnit==='kg'?'selected':''}>kg</option>
                <option value="lbs" ${state.profile.weightUnit==='lbs'?'selected':''}>lbs</option>
              </select>
            </div>
         </div>
      </div>
      
      <div class="card">
         <div class="card-title" style="text-align:left;">Ability Profile</div>
         <p style="font-size:0.85rem; color:var(--muted); margin-top:0;">Generated workouts will scale to these settings.</p>
         ${buildSelect("upper", "Upper Body")}
         ${buildSelect("lower", "Lower Body")}
         ${buildSelect("core", "Core Strength")}
         ${buildSelect("conditioning", "Conditioning")}
      </div>
      
      <div class="card">
         <div class="card-title" style="text-align:left;">🩹 Ongoing Issues</div>
         <p style="font-size:0.85rem; color:var(--muted); margin-top:0;">${getActiveIssues().length > 0 ? `${getActiveIssues().length} active — sessions auto-adjust around these.` : "Nothing logged. Track a nagging shoulder or a flared-up hip so sessions adjust automatically, even days after a same-day check-in would've cleared."}</p>
         <button class="btn btn-secondary" style="border-color:var(--accent); color:var(--accent); margin-bottom:0;" onclick="navigate('issues')">Manage Issues</button>
      </div>

      <div class="card">
         <div class="card-title" style="text-align:left;">★ Custom Exercises</div>
         ${customHtml}
      </div>

      <div class="card">
         <div class="card-title" style="text-align:left;">⭐ Staple Exercises</div>
         ${stapleHtml}
      </div>

      <div class="card">
         <div class="card-title" style="text-align:left;">🚫 Avoid List</div>
         ${avoidHtml}
      </div>

      <div class="card">
         <div class="card-title" style="text-align:left;">Workout Playback</div>
         <div class="profile-row">
            <span class="profile-label">Countdown sounds</span>
            <input type="checkbox" ${soundOn ? "checked" : ""} onchange="toggleSound()" style="width:20px; height:20px;">
         </div>
         <p style="font-size:0.8rem; color:var(--muted); margin:0 0 6px;">Beeps for the last 5 seconds, plus a chime when an exercise or rest period ends.</p>
         <div class="profile-row">
            <span class="profile-label">Wait for me between exercises</span>
            <input type="checkbox" ${waitOn ? "checked" : ""} onchange="toggleWaitBetweenExercises()" style="width:20px; height:20px;">
         </div>
         <p style="font-size:0.8rem; color:var(--muted); margin-bottom:0;">When a phase ends, pause and wait for a tap instead of auto-continuing — handy if you're not always watching your phone mid-set.</p>
      </div>
      <div class="card">
         <div class="card-title" style="text-align:left;">Advanced Movements</div>
         <p style="font-size:0.85rem; color:var(--muted); margin-top:0;">Off by default — these carry more risk than the rest of the library and won't appear in generated or custom workouts until enabled here.</p>
         <div class="profile-row">
            <span class="profile-label">Backbends (Head Bridge, Full Bridge)</span>
            <input type="checkbox" ${bridgesOn ? "checked" : ""} onchange="toggleUnlock('advancedBridges')" style="width:20px; height:20px;">
         </div>
         <p style="font-size:0.8rem; color:var(--muted); margin-bottom:0;">⚠️ Head Bridge loads the neck directly and Full Bridge is a deep spinal extension. Both warrant a proper warm-up and a slow, careful build-up.</p>
      </div>
   `;
}
